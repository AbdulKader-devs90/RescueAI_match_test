<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post-adoption FAQ · Dogs on a Journey</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html#start">
      Dogs on a Journey <span>·</span> FAQ
    </a>
    <a class="faq-link" href="index.html">Terug naar de honden</a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">POST-ADOPTIE FAQ</p>
      <h1>Vragen na adoptie?</h1>
      <p class="intro">
        Stel een vraag over de eerste weken met je hond.
      </p>
      <div class="sample-questions">
  <p class="eyebrow">Voorbeeldvragen</p>

  <div class="sample-question-list">
    <button class="sample-question" type="button"
      data-question="Hoe pak ik wandelen en zindelijkheid aan?">
      Wandelen en zindelijkheid
    </button>

    <button class="sample-question" type="button"
      data-question="Wat kan ik verwachten tijdens de eerste weken?">
      De eerste weken
    </button>

    <button class="sample-question" type="button"
      data-question="Wat doe ik als mijn hond een ongelukje in huis heeft?">
      Een ongelukje in huis
    </button>
  </div>

  <details class="sample-more">
    <summary>Meer voorbeeldvragen</summary>
    <div class="sample-question-list">
      <button class="sample-question" type="button"
        data-question="Hoe maak ik mijn huis veilig voor mijn hond?">
        Je huis veilig maken
      </button>

      <button class="sample-question" type="button"
        data-question="Hoe bereid ik het eerste bezoek aan de dierenarts voor?">
        Eerste bezoek aan de dierenarts
      </button>
    </div>
  </details>
</div>
      <div id="chat-messages" aria-live="polite">
        <p>Hallo! Ik kan helpen met vragen over de informatie in onze adoptiegids.</p>
      </div>

      <form id="faq-form">
        <label for="faq-question">Jouw vraag</label>
        <input
          id="faq-question"
          name="question"
          type="text"
          placeholder="Bijvoorbeeld: Hoe pak ik wandelen en zindelijkheid aan?"
          required
        >
        <button class="primary" type="submit">Verstuur</button>
      </form>
    </section>
  </main>
</body>
</html>
