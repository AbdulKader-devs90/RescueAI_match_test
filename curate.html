<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose profile photos · Dogs on a Journey</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="curate.css"></head>
<body class="curation"><header class="site-header"><a class="brand" href="/">Dogs on a Journey <span>·</span> Match</a><span class="curation-label">Editor view</span></header><main class="curation-main"><p class="eyebrow">Photo curation</p><h1>Choose profile photo</h1><p class="intro">Every image below comes from the raw dog-photo folders. Click one photo for each dog; your choices are saved locally for the MVP.</p><div id="gallery">Loading photo folders…</div></main><script>
const names={azra:'Azra',beanie:'Beanie',belka:'Belka',benji:'Benji',blake:'Blake',cara:'Cara',chap:'Chap',chewy:'Chewy',cinnamon:'Cinnamon',claude:'Claude',elliot:'Elliot',hughie:'Hughie',izzy:'Izzy',molly:'Molly',shaggie:'Shaggie',soul:'Soul'};
fetch('/api/gallery').then(r=>r.json()).then(groups=>{const root=document.getElementById('gallery');Object.entries(groups).forEach(([dog,images])=>{const section=document.createElement('section');section.className='gallery-group';section.innerHTML=`<div class="gallery-heading"><h2>${names[dog]}</h2><span>${images.length} photos</span></div><div class="photo-grid"></div>`;const grid=section.querySelector('.photo-grid');images.forEach((image,index)=>{const button=document.createElement('button');button.className='photo-choice';button.innerHTML=`<img loading="lazy" src="${image.url}" alt="${names[dog]} photo ${index+1}"><span>Use this photo</span><small>${index+1}</small>`;button.onclick=async()=>{const response=await fetch('/api/profile-photo-selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dogId:dog,imageId:image.id})});if(!response.ok)return alert('Could not save that choice.');grid.querySelectorAll('.photo-choice').forEach(item=>item.classList.remove('chosen'));button.classList.add('chosen');button.querySelector('span').textContent='Selected'};grid.append(button)});root.append(section)})});
</script></body></html>
